name: Build and deploy feedback site

# Manual only: run this after previewing locally, so new feedback never goes live by accident.
on:
  workflow_dispatch:

permissions:
  actions: write   # lets the last step delete the build artifact
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build site
        env:
          SHEET_SOURCES: ${{ secrets.SHEET_SOURCES }}
          DASHBOARD_PASSPHRASE: ${{ secrets.DASHBOARD_PASSPHRASE }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python generate.py --strict
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 1
      - id: deployment
        uses: actions/deploy-pages@v4
      # The artifact holds every player's page in plain text, and any signed-in GitHub user can
      # download artifacts from a public repo. The site is already published, so delete it now.
      - name: Delete the build artifact
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({ owner, repo, run_id: context.runId });
            for (const a of data.artifacts) {
              await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: a.id });
            }
