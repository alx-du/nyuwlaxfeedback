<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Feedback Envelope – NYU Women's Lacrosse</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header><img src="assets/logo.png" alt="NYU Women's Lacrosse"><h1>Feedback Envelope</h1></header>
<main id="main">
<div class="card" id="gate">
<h2>Open your envelope</h2>
<form id="f">
<input type="text" id="code" placeholder="Enter your code" autocomplete="off" autocapitalize="off" spellcheck="false" required>
<button type="submit">Open</button>
</form>
<div class="err" id="err"></div>
</div>
<div id="dash" hidden></div>
</main>
<script src="assets/dashboard.js"></script>
<script>
// A player code (five letters + three digits) opens that player's page. Anything else is tried as the
// staff passphrase: if it decrypts staff.json, the dashboard is shown right here.
var main = document.getElementById("main"), err = document.getElementById("err");

async function openDashboard(pass) {
  try {
    var res = await fetch("staff.json");
    if (!res.ok) return false;
    var data = await Dash.decrypt(await res.json(), pass);
  } catch (_) { return false; }
  document.getElementById("gate").hidden = true;
  var d = document.getElementById("dash"); d.hidden = false;
  main.classList.add("wide");
  Dash.render(d, data);
  return true;
}

document.getElementById("f").addEventListener("submit", async function (e) {
  e.preventDefault();
  err.textContent = "";
  var code = document.getElementById("code").value.trim();
  if (!code) return;
  var isPlayerCode = /^[a-z]{5}[0-9]{3}$/i.test(code);
  var url = "f/" + code.toLowerCase() + ".html";
  if (isPlayerCode) {
    try { if ((await fetch(url, { method: "HEAD" })).ok) { window.location.href = url; return; } } catch (_) {}
  }
  if (await openDashboard(code)) return;
  if (isPlayerCode) { window.location.href = url; return; }  // shows the friendly "invalid code" page
  err.textContent = "Invalid code. Double check your input.";
});
</script>
</body>
</html>
